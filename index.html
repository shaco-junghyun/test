<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shaco's test page</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #111; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #fafafa; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: clamp(2rem, 8vw, 5rem); margin: 0; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <h1>shaco's test v2</h1>
</body>
</html>
