# 릴리즈를 게시하면 그 태그의 코드로 운영 배포. 운영에 올릴 커밋 = 릴리즈 태그가 가리키는 커밋.
name: Deploy production

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Deploy production
        run: |
          url=$(npx --yes vercel@66.6.0 deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "production (${{ github.event.release.tag_name }}): $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
