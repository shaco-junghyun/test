# PR을 열 때와 push할 때마다 Claude가 리뷰한다.
# 잡 이름 review 는 main 룰셋의 필수 검사다. Important 지적이 있거나 리뷰 결과가 없으면(오류, 아래 검증으로 건너뜀) 실패한다.
# 리뷰가 틀렸으면 룰셋 우회 권한이 있는 사람(관리자)이 머지 화면에서 우회해 머지한다.
# 리뷰 기준: .claude/skills/pr-review/SKILL.md (액션이 .claude/ 를 main에서 가져오므로 PR이 기준을 못 바꾼다)
# 이 파일도 main과 같아야 리뷰가 돈다(액션의 워크플로 검증).
name: Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 연달아 push하면 이전 리뷰를 취소하고 마지막 것만 돌린다
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 이미 단 줄 단위 지적을 넘겨서 같은 지적이 push마다 쌓이지 않게 한다
      - name: Collect previous inline comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review-context
          gh api "repos/${{ github.repository }}/pulls/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]") | {path, line, body}]' \
            > .review-context/previous-inline.json
          jq length .review-context/previous-inline.json

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allow_fork_prs: "false"
          prompt: "/pr-review ${{ github.repository }} ${{ github.event.pull_request.number }}"
          # default 모드: --allowedTools 에 없는 도구는 거절 (기본 auto 모드는 목록 밖 도구도 안전 검토를 통과하면 실행)
          claude_args: |
            --permission-mode default
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"important":{"type":"integer","minimum":0},"nit":{"type":"integer","minimum":0}},"required":["important","nit"]}'

      # 리뷰 결과로 머지를 막는다. 결과가 없으면 막는다(fail closed).
      - name: Block on Important findings
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [[ -z "$RESULT" ]]; then
            echo "::error::리뷰 결과가 없습니다(오류 또는 review.yml 변경으로 건너뜀). 사람이 확인한 뒤 우회 권한으로 머지하세요."
            exit 1
          fi
          important=$(jq -r '.important' <<<"$RESULT")
          nit=$(jq -r '.nit' <<<"$RESULT")
          echo "리뷰 결과: Important $important / Nit $nit" >> "$GITHUB_STEP_SUMMARY"
          if (( important > 0 )); then
            echo "::error::Important 지적 ${important}개. 고치거나, 리뷰가 틀렸으면 우회 권한으로 머지하세요."
            exit 1
          fi
